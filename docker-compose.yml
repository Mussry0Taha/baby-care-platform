services:
  postgres:
    image: postgres:16-alpine
    container_name: babycare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: babycare
      POSTGRES_PASSWORD: babycare_dev
      POSTGRES_DB: babycare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: babycare-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: rustfs/rustfs:latest
    container_name: babycare-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: babycare
      MINIO_ROOT_PASSWORD: babycare_dev
    ports:
      - "9200:9000"
      - "9201:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:



